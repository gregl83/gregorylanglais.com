baseURL = 'https://gregorylanglais.com/'
languageCode = 'en-us'
title = 'Gregory Langlais'
theme = 'gregorylanglais'
enableRobotsTXT = true

[params]
seoTitle = 'Gregory Langlais | Distributed Systems Engineering'
description = 'Distributed systems engineering for massive scale and extreme reliability. Explore Gregory Langlais’s projects and professional profiles.'
subtitle = """
Distributed Systems Engineering
Massive Scale and Extreme Reliability"""
organization = "Gregory Langlais"
mainSections = ['referrals']

[module]
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "node_modules/bootstrap/scss"
        target = "assets/sass/bootstrap"
    [[module.mounts]]
        source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
        target = "assets/js/bootstrap.bundle.min.js"
    [[module.mounts]]
        source = "node_modules/jquery/dist/jquery.slim.js"
        target = "assets/js/jquery.slim.js"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
