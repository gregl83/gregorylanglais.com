{{ define "main" }}
{{ $referrals := where site.RegularPages "Type" "in" site.Params.mainSections }}
<main class="home">
    <div class="container d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center text-center">
            <div class="col-12">
                {{ if $referrals }}
                <div class="orbit">
                    <div class="orbit-connectors" aria-hidden="true">
                        <div class="orbit-trail station-link station-link-1"></div>
                        <div class="orbit-trail station-link station-link-2"></div>
                        <div class="orbit-trail station-link station-link-3"></div>
                        <div class="orbit-trail station-link station-link-4"></div>
                        <div class="orbit-trail station-link station-link-5"></div>
                        <div class="orbit-trail station-link station-link-6"></div>
                    </div>
                    <ul class="list-unstyled social orbital-icons m-0">
                    {{ range $referrals.ByWeight }}
                    <li>
                        {{- partial "icon.html" . -}}
                    </li>
                    {{ end }}
                    </ul>
                </div>
                {{ end }}
            </div>
        </div>
    </div>
</main>
{{ end }}
